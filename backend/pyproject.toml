[project]
name = "exegete"
version = "0.1.0"
description = "backend for exegete.app"
authors = [{ name = "Grahame Bowland", email = "grahame@bowland.au" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "fastapi-users[sqlalchemy]",
    "pydantic",
    "jsonschema",
    "lxml",
    "aiohttp",
    "alembic",
    "nltk",
    "requests",
    "asyncpg",
    "redis",
    "watchfiles",
    "psycopg2",
    "pydantic-settings",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pyright>=1.1.414,<2",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["exegete"]

[tool.ruff.lint]
# keep ruff's pre-0.17 default rule set
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]
